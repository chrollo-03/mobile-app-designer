name: check

on:
  push:
  pull_request:

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile scripts
        run: python -m py_compile scripts/*.py
      - name: Check the bundled example
        run: |
          python scripts/check_design.py examples/barwise/design-spec.json
          python scripts/audit_design.py examples/barwise/Barwise.figcraft Screens
      - name: Palette presets
        run: |
          python scripts/palette.py list
          python scripts/palette.py preset food-delivery
