schema_version: "1.1"
name: no-design-tool-installed
expected_outcome: |
  The run detects that no design tool is connected (e.g. with scripts/figcraft_setup.py detect),
  reports the OS and the matching FigCraft release, and asks the user before installing or changing
  their Claude Code config, offering HTML mockups as the alternative. It does not install software
  or register an MCP server without asking, and it does not claim FigCraft tools are usable before
  Claude Code is restarted.
